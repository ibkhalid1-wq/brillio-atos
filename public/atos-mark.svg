<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AURA "Drawn Line" mark, favicon tile: the five-movement spine
       (Frame, Listen, Prototype, Ship, Evolve) rising through its nodes,
       the peak drawing the A. Deep Indigo #1D1545 tile, white linework,
       Electric Violet #6E5BFF crossbar = the human in the loop. -->
  <rect width="64" height="64" rx="14" fill="#1D1545"/>
  <polyline points="10,42 20,42 32,18 44,42 54,42" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="25.5" y1="33.5" x2="38.5" y2="33.5" stroke="#6E5BFF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="10" cy="42" r="3.6" fill="#6E5BFF"/>
  <circle cx="54" cy="42" r="3.6" fill="#6E5BFF"/>
</svg>
