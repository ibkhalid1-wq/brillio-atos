<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- ATOS — one flow stroke. A single rising curve from deep indigo (where
       the enterprise starts) to Brillio green (the demonstrated result).
       Nothing else. -->
  <defs>
    <linearGradient id="flow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#332672"/>
      <stop offset=".55" stop-color="#6A5BC7"/>
      <stop offset="1" stop-color="#2CC84D"/>
    </linearGradient>
  </defs>
  <path d="M5.5 26.5 C7.5 19.5 11.5 17 16 15.2 C21 13.2 24.5 10 26.5 5.5"
        fill="none" stroke="url(#flow)" stroke-width="3.6" stroke-linecap="round"/>
</svg>
