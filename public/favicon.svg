<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- ATOS mark: 3D network sphere, TRANSPARENT background — a wireframe globe
       (orbital great-circles in mid-indigo, legible on light or dark chrome)
       with spherical nodes in the evidence grammar: blue = heard, lavender =
       made, green = demonstrated (the brightest hub). One artwork with the
       in-app AtosMark. -->
  <defs>
    <radialGradient id="nGreen" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#8BF0A4"/>
      <stop offset=".55" stop-color="#2CC84D"/>
      <stop offset="1" stop-color="#128A32"/>
    </radialGradient>
    <radialGradient id="nBlue" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#B4CCFF"/>
      <stop offset=".55" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#3557B0"/>
    </radialGradient>
    <radialGradient id="nLav" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#E2DBFF"/>
      <stop offset=".55" stop-color="#B3A6F7"/>
      <stop offset="1" stop-color="#7E6CCF"/>
    </radialGradient>
    <filter id="drop" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1" stdDeviation=".9" flood-color="#080418" flood-opacity=".45"/>
    </filter>
  </defs>
  <g fill="none" stroke="#5D4FB8" stroke-width="1.2" opacity=".85">
    <circle cx="16" cy="16" r="13.6"/>
    <ellipse cx="16" cy="16" rx="13.6" ry="5.2"/>
    <ellipse cx="16" cy="16" rx="13.6" ry="5.2" transform="rotate(-58 16 16)"/>
  </g>
  <g stroke="#8678D6" stroke-width="1" stroke-linecap="round" opacity=".9">
    <line x1="7.2" y1="18.6" x2="15.6" y2="22.2"/>
    <line x1="15.6" y1="22.2" x2="23.6" y2="11.4"/>
    <line x1="10.4" y1="8.4" x2="23.6" y2="11.4"/>
  </g>
  <g filter="url(#drop)">
    <circle cx="10.4" cy="8.4" r="2" fill="url(#nBlue)"/>
    <circle cx="7.2" cy="18.6" r="2.5" fill="url(#nBlue)"/>
    <circle cx="15.6" cy="22.2" r="2.8" fill="url(#nLav)"/>
    <circle cx="23.6" cy="11.4" r="3.8" fill="url(#nGreen)"/>
  </g>
</svg>
