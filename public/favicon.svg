<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Brillio · ATOS — the wordmark's two green dots on the app's deep-indigo
       tile, so the mark holds contrast on light and dark tab bars alike. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2364"/>
      <stop offset="1" stop-color="#1A1240"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#tile)"/>
  <circle cx="10.6" cy="16" r="5.4" fill="#2CC84D"/>
  <circle cx="21.4" cy="16" r="5.4" fill="#2CC84D"/>
</svg>
