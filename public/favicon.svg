<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- ATOS Flow signature: the flow spine climbing to the demo. Three nodes on
       the engagement path in the app's evidence grammar — blue (what people
       said) → lavender-indigo (what ATOS made) → green (what was demonstrated,
       the gate). On the app's deep-indigo chrome tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2364"/>
      <stop offset="1" stop-color="#1A1240"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#tile)"/>
  <path d="M8 23 L16 16.5 L23.5 9.5" fill="none" stroke="rgba(255,255,255,0.38)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="8" cy="23" r="3" fill="#5B8DEF"/>
  <circle cx="16" cy="16.5" r="3.2" fill="#B3A6F7"/>
  <circle cx="23.5" cy="9.5" r="4.2" fill="#2CC84D"/>
</svg>
