<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- ATOS mark — premium wireframe network sphere. Fine graded linework with
       true front/back depth (rear arcs recede, front arcs advance), three
       spherical nodes in the evidence grammar with a glowing green hub: the
       framework's thesis — evidence connected into a demonstrated system. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8678D6"/>
      <stop offset="1" stop-color="#4A3AA0"/>
    </linearGradient>
    <radialGradient id="nGreen" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#95F2AC"/>
      <stop offset=".55" stop-color="#2CC84D"/>
      <stop offset="1" stop-color="#0F8A30"/>
    </radialGradient>
    <radialGradient id="nBlue" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#BDD2FF"/>
      <stop offset=".55" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#3050A8"/>
    </radialGradient>
    <radialGradient id="nLav" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#E8E2FF"/>
      <stop offset=".55" stop-color="#B3A6F7"/>
      <stop offset="1" stop-color="#7565C9"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="rgba(44,200,77,.5)"/>
      <stop offset="1" stop-color="rgba(44,200,77,0)"/>
    </radialGradient>
    <filter id="drop" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy=".9" stdDeviation=".8" flood-color="#0A0620" flood-opacity=".4"/>
    </filter>
  </defs>
  <!-- sphere rim -->
  <circle cx="16" cy="16" r="13.4" fill="none" stroke="url(#rim)" stroke-width="1.1"/>
  <!-- great circles: rear halves recede, front halves advance -->
  <g fill="none" stroke="#6A5BC7" stroke-linecap="round">
    <path d="M2.8 15 A13.2 4.9 0 0 1 29.2 15" stroke-width=".7" opacity=".3"/>
    <path d="M2.8 15 A13.2 4.9 0 0 0 29.2 15" stroke-width="1.1" opacity=".8"/>
    <path d="M9.2 4.6 A4.9 13.2 32 0 0 21.6 28.1" stroke-width=".7" opacity=".3"/>
    <path d="M9.2 4.6 A4.9 13.2 32 0 1 21.6 28.1" stroke-width="1.1" opacity=".8"/>
  </g>
  <!-- network chords -->
  <g stroke="#8678D6" stroke-width=".9" stroke-linecap="round" opacity=".75">
    <line x1="7.6" y1="19.4" x2="15.4" y2="21.8"/>
    <line x1="15.4" y1="21.8" x2="22.8" y2="10.8"/>
    <line x1="7.6" y1="19.4" x2="22.8" y2="10.8"/>
  </g>
  <!-- nodes: hub glow first, then spheres -->
  <circle cx="22.8" cy="10.8" r="7.2" fill="url(#glow)"/>
  <g filter="url(#drop)">
    <circle cx="7.6" cy="19.4" r="2.3" fill="url(#nBlue)"/>
    <circle cx="15.4" cy="21.8" r="2.7" fill="url(#nLav)"/>
    <circle cx="22.8" cy="10.8" r="3.7" fill="url(#nGreen)"/>
  </g>
  <ellipse cx="21.8" cy="9.6" rx="1.3" ry=".85" fill="rgba(255,255,255,.5)"/>
</svg>
