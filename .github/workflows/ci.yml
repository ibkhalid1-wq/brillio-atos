# ATOS Flow CI — typecheck, the full suite (646+ tests), and the client↔edge
# lockstep contracts (src/v3/__tests__/edgeLockstep.test.ts) on every push.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
