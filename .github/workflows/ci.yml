# ATOS Flow CI.
#
# ONE STEP, AND IT IS THE PROJECT'S OWN COMMAND. This used to spell the gate out
# by hand — typecheck, lint, `npx vitest run` — which is an APPROXIMATION of
# `npm run validate`, and it drifted in two ways that mattered:
#
#   · `npm run validate` also runs the BUILD. CI did not, so a broken build was
#     green here and only failed on someone's machine.
#   · `npx vitest run` is not `npm test`. The same substitution hid a red lint
#     gate for an entire working session: `npm run lint` carries
#     `--report-unused-disable-directives --max-warnings 0` and a hand-rolled
#     `npx eslint src` carries neither.
#
# If the gate should change, change `validate` in package.json — one definition,
# and every machine runs the same one.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # NO `.env.local` HERE, AND THAT IS THE POINT. `supabase` is `null as any`
      # when the env is unconfigured, so any unguarded call site crashes for a
      # runner — and for an engineer on their first clone. A developer machine has
      # the env and can never see it. The first run of this gate found one.
      - run: npm run validate
      # THE EDGE FUNCTIONS ARE DENO AND `npm test` DOES NOT SEE THEM. They were never
      # type-checked at all until 2026-08-13, and the first check found real errors in
      # both public-facing ones. Kept OUT of `validate` on purpose: a new engineer must
      # not need a second runtime installed to run the project's gate. CI has both, so
      # CI runs both.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run check:edge
